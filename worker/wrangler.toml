name = "quantum-algo-newsletter"
main = "index.js"
compatibility_date = "2026-01-01"

# Espace de stockage prive des inscrits.
# Remplace l'id ci-dessous par celui affiche par :  npx wrangler kv namespace create SUBS
[[kv_namespaces]]
binding = "SUBS"
id = "18d22ac8153a49268f514782aeaa3373"

[vars]
# Seul ton site a le droit d'appeler /subscribe depuis un navigateur
ALLOWED_ORIGIN = "https://papagallotoon.github.io"
GH_REPO = "Papagallotoon/Quantum-algo"
SEND_HOUR_PARIS = "7"

# Lancement de la routine du matin : 7 h 45 a Paris (lettre recue vers 8 h), du lundi au vendredi.
# 05:45 UTC = 7 h 45 l'ete, 06:45 UTC = 7 h 45 l'hiver ; le code ne garde que le bon.
[triggers]
crons = ["45 5 * * 1-5", "45 6 * * 1-5"]
