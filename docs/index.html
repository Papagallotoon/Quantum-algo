<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quantum Algo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%234fdd9a' stroke-width='5'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0c10; --top: #10161e; --card: rgba(255,255,255,0.045); --card2: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08); --soft: rgba(255,255,255,0.05);
    --text: #e8eaec; --dim: rgba(232,234,236,0.55); --dimmer: rgba(232,234,236,0.36);
    --up: #5fe3a1; --down: #f0705f; --ring: #4fdd9a; --ringDown: #e05c4b; --amber: #f2c14e; --blue: #7cb4ff; --ink: #07120c;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 60px; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(10,12,16,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  .bar { max-width: 980px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { font-family: var(--mono); font-weight: 700; letter-spacing: 2px; font-size: 12px; color: var(--dim); }
  .brand b { color: var(--ring); }
  nav { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); padding: 3px; border-radius: 12px; }
  nav a { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .8px; padding: 7px 12px; border-radius: 9px; color: var(--dim); }
  nav a.on { background: var(--ring); color: var(--ink); }
  .search { flex: 1; min-width: 180px; position: relative; }
  .search input { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 9px 12px; font-size: 14px; outline: none; }
  .search input:focus { border-color: rgba(79,221,154,.5); }
  .results { position: absolute; top: 42px; left: 0; right: 0; background: #11161d; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: none; max-height: 340px; overflow-y: auto; }
  .results a { display: flex; justify-content: space-between; padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--soft); }
  .results a:hover { background: var(--card2); }
  h1 { font-size: 28px; letter-spacing: -.6px; margin: 22px 0 4px; }
  h2 { font-size: 13px; font-family: var(--mono); letter-spacing: 1.4px; color: var(--dim); font-weight: 600; margin: 0 0 12px; text-transform: uppercase; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-top: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } h1 { font-size: 24px; } }
  .muted { color: var(--dim); } .dimmer { color: var(--dimmer); }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--dim); }
  .mono { font-family: var(--mono); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--dimmer); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 8px; border-bottom: 1px solid var(--soft); font-size: 14px; vertical-align: middle; }
  td.r, th.r { text-align: right; }
  tr.link { cursor: pointer; } tr.link:hover td { background: var(--soft); }
  .pill { display: inline-block; font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .6px; padding: 5px 10px; border-radius: 999px; }
  .p-buy { background: rgba(79,221,154,.16); color: var(--up); }
  .p-wait { background: rgba(242,193,78,.15); color: var(--amber); }
  .p-avoid { background: rgba(224,92,75,.16); color: var(--down); }
  .p-flat { background: var(--card2); color: var(--dim); }
  .d-now { background: rgba(79,221,154,.18); color: var(--up); }
  .d-soon { background: rgba(251,146,60,.16); color: #fb923c; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 8px 13px; border-radius: 20px; border: 1px solid rgba(255,255,255,.2); background: var(--card2); color: rgba(232,234,236,.82); cursor: pointer; }
  .chip.on { background: var(--ring); border-color: var(--ring); color: var(--ink); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin-top: 8px; cursor: pointer; }
  .row:hover { background: var(--card2); }
  .ring { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--dimmer); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; font-weight: 700; flex: none; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .small { font-size: 12px; }
  .boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .box { border-radius: 12px; padding: 10px 8px; text-align: center; }
  .box .l { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; font-weight: 700; }
  .box .v { font-size: 18px; font-weight: 700; margin-top: 3px; }
  .box .s { font-size: 11px; margin-top: 2px; }
  .b-in { background: rgba(124,180,255,.1); } .b-in .l, .b-in .s { color: var(--blue); }
  .b-tg { background: rgba(79,221,154,.1); } .b-tg .l, .b-tg .s { color: var(--up); }
  .b-st { background: rgba(224,92,75,.1); } .b-st .l, .b-st .s { color: var(--down); }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 13.5px; border-bottom: 1px solid var(--soft); }
  .kv span:first-child { color: var(--dim); }
  .bar2 { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; position: relative; }
  .warn { background: rgba(242,193,78,.1); color: var(--amber); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-top: 8px; }
  .news a { display: block; padding: 9px 0; border-bottom: 1px solid var(--soft); font-size: 14px; line-height: 1.35; }
  .news a:hover { color: #fff; }
  .tone { font-family: var(--mono); font-size: 10px; font-weight: 700; margin-right: 6px; }
  .hz { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .hz > div { text-align: center; padding: 9px 4px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; }
  .hz > div.on { border-color: rgba(79,221,154,.55); background: rgba(79,221,154,.08); }
  .tabs { display: flex; background: var(--card2); border-radius: 10px; padding: 3px; gap: 2px; margin-top: 12px; }
  .tabs a { flex: 1; text-align: center; font-family: var(--mono); font-size: 11px; letter-spacing: 1px; padding: 8px; border-radius: 7px; color: var(--dim); cursor: pointer; }
  .tabs a.on { background: rgba(255,255,255,.13); color: var(--text); }
  .back { font-size: 20px; color: var(--dim); cursor: pointer; margin-right: 8px; }
  .disc { color: var(--dimmer); font-size: 12px; line-height: 1.6; margin-top: 28px; text-align: center; }
  .empty { color: var(--dim); font-size: 14px; padding: 6px 0; }
  @media (max-width: 560px) {
    .row { gap: 10px; padding: 11px 12px; }
    .row svg { display: none; }
    .row .pill { font-size: 9.5px; padding: 4px 8px; }
    .row > div:last-child { min-width: 0 !important; }
    .chartlbl span:nth-child(2) { display: none; }
    .boxes .v { font-size: 15px; }
    td { padding: 8px 5px; font-size: 13px; }
  }
  .modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(5,7,10,.88); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { max-width: 560px; width: 100%; max-height: 90vh; overflow-y: auto; background: #11161d; border: 1px solid var(--border); border-radius: 20px; padding: 22px; }
  .modal h3 { margin: 4px 0 10px; font-size: 21px; }
  .modal p, .modal li { color: rgba(232,234,236,.78); font-size: 14px; line-height: 1.55; }
  .btn { display: inline-block; border: 0; cursor: pointer; font-weight: 700; font-size: 14px; padding: 11px 18px; border-radius: 12px; }
  .btn-main { background: var(--ring); color: var(--ink); }
  .btn-sec { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
  .nl { position: fixed; right: 16px; bottom: 16px; z-index: 40; width: 340px; max-width: calc(100vw - 32px); background: #11161d; border: 1px solid rgba(79,221,154,.35); border-radius: 18px; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .nl input[type=email] { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 8px 0; outline: none; }
  .nl label { display: flex; gap: 8px; font-size: 12px; color: var(--dim); line-height: 1.4; align-items: flex-start; }
  .nl .x { position: absolute; top: 8px; right: 12px; color: var(--dim); cursor: pointer; font-size: 18px; }
  .navnl { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .8px; padding: 8px 12px; border-radius: 10px; background: rgba(79,221,154,.14); color: var(--up); cursor: pointer; border: 1px solid rgba(79,221,154,.35); }
  .legal h2 { margin-top: 22px; } .legal p, .legal li { line-height: 1.6; color: rgba(232,234,236,.8); font-size: 14.5px; }
  .mod { display: block; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); cursor: pointer; }
  .mod:hover { background: var(--card2); }
  .lesson p { line-height: 1.65; font-size: 15.5px; color: rgba(232,234,236,.86); margin: 0 0 10px; }
  .lesson li { line-height: 1.6; font-size: 15px; color: rgba(232,234,236,.86); }
  .opt { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-top: 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px; cursor: pointer; }
  .opt:hover { background: var(--card2); }
  .opt.good { border-color: rgba(79,221,154,.7); background: rgba(79,221,154,.12); }
  .opt.bad { border-color: rgba(224,92,75,.7); background: rgba(224,92,75,.12); }
  .progress { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin: 10px 0 4px; }
  .progress div { height: 6px; background: var(--ring); }
  .loading { padding: 80px 0; text-align: center; color: var(--dim); font-family: var(--mono); letter-spacing: 1px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="#/"><b>●</b> QUANTUM ALGO</a>
    <nav id="nav">
      <a href="#/" data-r="today">AUJOURD'HUI</a>
      <a href="#/indices" data-r="indices">INDICES</a>
      <a href="#/bilan" data-r="bilan">BILAN</a>
      <a href="#/apprendre" data-r="apprendre">APPRENDRE</a>
    </nav>
    <a class="navnl" id="nlbtn">✉ NEWSLETTER</a>
    <div class="search"><input id="q" placeholder="Chercher une valeur…" autocomplete="off"><div class="results" id="res"></div></div>
  </div>
</header>
<main class="wrap" id="app"><div class="loading">CHARGEMENT…</div></main>

<script>
(function () {
  "use strict";
  var D = null;
  var HL = { "1J": "1 jour", "1S": "1 semaine", "1M": "1 mois", "3M": "3 mois" };
  var HK = ["1J", "1S", "1M", "3M"];
  var st = { h: get("h") || "1M", tab: "est", cat: "Tous" };
  function get(k) { try { return localStorage.getItem("qa." + k); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem("qa." + k, v); } catch (e) {} }

  // ---------- format ----------
  function ok(v) { return v != null && isFinite(v); }
  function f2(v) { return ok(v) ? Number(v).toFixed(2).replace(".", ",") : "-"; }
  function f1(v) { return ok(v) ? Number(v).toFixed(1).replace(".", ",") : "-"; }
  function sp(v, d) { return ok(v) ? (v >= 0 ? "+" : "") + Number(v).toFixed(d == null ? 2 : d).replace(".", ",") + " %" : "-"; }
  function pc(p) { return ok(p) ? Math.round(p * 100) + " %" : "-"; }
  function cls(v) { return !ok(v) ? "flat" : v >= 0 ? "up" : "down"; }
  function pcls(p) { return p >= 0.53 ? "up" : p <= 0.47 ? "down" : "flat"; }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function dfr(iso) { if (!iso) return "-"; var d = new Date(iso); return d.toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit", timeZone: "Europe/Paris" }); }
  function ago(ms) { if (!ms) return ""; var h = Math.round((Date.now() - ms) / 3600e3); return h < 1 ? "à l'instant" : h < 24 ? "il y a " + h + " h" : "il y a " + Math.round(h / 24) + " j"; }
  function moodOf(p) { return p >= 0.58 ? "avantage net" : p >= 0.53 ? "léger avantage" : p > 0.47 ? "≈ pile ou face" : p > 0.42 ? "plutôt baissier" : "nettement baissier"; }
  function pillCls(a) { return a === "ENTRER" ? "p-buy" : a === "EVITER" ? "p-avoid" : a === "NEUTRE" ? "p-flat" : "p-wait"; }
  function actLabel(a, l) { return a === "ENTRER" ? "ACHETER" : (l || a).toUpperCase(); }

  // ---------- petits graphiques SVG ----------
  function dial(p, size, stroke, label) {
    var up = p >= 0.5, neutral = Math.abs(p - 0.5) < 0.03;
    var score = Math.round((up ? p : 1 - p) * 100);
    var col = neutral ? "rgba(232,234,236,.45)" : up ? "#4fdd9a" : "#e05c4b";
    var r = (size - stroke) / 2, c = 2 * Math.PI * r;
    return '<div style="position:relative;width:' + size + 'px;height:' + size + 'px;margin:0 auto">' +
      '<svg width="' + size + '" height="' + size + '" style="position:absolute;inset:0"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke="rgba(255,255,255,.09)" stroke-width="' + stroke + '" fill="none"/>' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke="' + col + '" stroke-width="' + stroke + '" fill="none" stroke-dasharray="' + (c * score / 100) + ' ' + c + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')" stroke-linecap="round"/></svg>' +
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">' +
      (label ? '<div class="mono dimmer" style="font-size:10px;letter-spacing:1.4px">' + esc(label) + '</div>' : '') +
      '<div class="' + (neutral ? "flat" : up ? "up" : "down") + '" style="font-size:' + Math.round(size / 4.2) + 'px;font-weight:800;letter-spacing:-1px">' + score + ' %</div>' +
      '<div class="mono muted" style="font-size:11px;text-align:center;line-height:1.4">' + (up ? "de chances de hausse" : "de chances de baisse") + '<br>' + moodOf(p) + '</div></div></div>';
  }
  function spark(h, w, hh, col) {
    if (!h || h.length < 2) return "";
    var s = h.slice(-40), lo = Math.min.apply(null, s), hi = Math.max.apply(null, s), sp_ = hi - lo || 1;
    var pts = s.map(function (v, i) { return (i / (s.length - 1)) * w + "," + (hh - ((v - lo) / sp_) * hh * 0.86 - hh * 0.07); }).join(" ");
    return '<svg width="' + w + '" height="' + hh + '"><polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="1.5"/></svg>';
  }
  function chart(a, h) {
    var W = 900, H = 220, split = W * 0.72, hist = a.hist || [];
    if (hist.length < 2) return "";
    var mc = a.mc[h] || {}, lo = Math.min.apply(null, hist), hi = Math.max.apply(null, hist);
    if (ok(mc.lo)) lo = Math.min(lo, mc.lo); if (ok(mc.hi)) hi = Math.max(hi, mc.hi);
    var p = a.plan, levels = [];
    if (p && ok(p.stop) && p.action !== "NEUTRE") levels.push([p.stop, "#e05c4b", "stop"]);
    if (p && ok(p.target)) levels.push([p.target, "#4fdd9a", "objectif"]);
    levels.forEach(function (l) { lo = Math.min(lo, l[0]); hi = Math.max(hi, l[0]); });
    var span = hi - lo || 1, y = function (v) { return H - ((v - lo) / span) * H * 0.88 - H * 0.06; };
    var pts = hist.map(function (v, i) { return [(i / (hist.length - 1)) * split, y(v)]; });
    var line = pts.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" ");
    var last = pts[pts.length - 1], up = (a.ev[h] || {}).p >= 0.5, col = up ? "#4fdd9a" : "#e05c4b";
    var cone = ok(mc.lo) ? last[0] + "," + last[1] + " " + W + "," + y(mc.hi) + " " + W + "," + y(mc.lo) : "";
    var lv = levels.map(function (l) { return '<line x1="0" x2="' + W + '" y1="' + y(l[0]) + '" y2="' + y(l[0]) + '" stroke="' + l[1] + '" stroke-dasharray="4 5" stroke-width="1" opacity=".7"/><text x="4" y="' + (y(l[0]) - 4) + '" fill="' + l[1] + '" font-size="11" font-family="monospace">' + l[2] + ' ' + f2(l[0]) + '</text>'; }).join("");
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + col + '" stop-opacity=".28"/><stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>' +
      '<polygon points="' + line + ' ' + split + ',' + H + ' 0,' + H + '" fill="url(#g)"/>' + lv +
      '<polyline points="' + line + '" fill="none" stroke="' + col + '" stroke-width="2"/>' +
      (cone ? '<polygon points="' + cone + '" fill="' + col + '" fill-opacity=".15"/>' : '') +
      '<line x1="' + split + '" x2="' + split + '" y1="0" y2="' + H + '" stroke="rgba(232,234,236,.2)"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="4.5" fill="#e8eaec"/></svg>' +
      '<div class="mono dimmer chartlbl" style="display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;margin-top:6px"><span>' + hist.length + ' SÉANCES</span><span>AUJOURD\'HUI</span><span style="color:' + col + '">PROJECTION ' + esc(HL[h]).toUpperCase() + ' (90 %)</span></div>';
  }

  // ---------- blocs ----------
  function stockRow(a, h) {
    var e = a.ev[h] || {}, up = e.p >= 0.5, strong = Math.abs(e.p - 0.5) >= 0.03;
    var col = !strong ? "rgba(232,234,236,.35)" : up ? "#4fdd9a" : "#e05c4b";
    var score = Math.round((up ? e.p : 1 - e.p) * 100);
    return '<a class="row" href="#/v/' + encodeURIComponent(a.sym) + '">' +
      '<div class="ring" style="border-color:' + col + ';color:' + col + '">' + score + '</div>' +
      '<div class="grow" title="' + Math.round((up ? e.p : 1 - e.p) * 100) + ' chances sur 100 de ' + (up ? 'hausse' : 'baisse') + ' sur ' + esc(HL[h]) + '"><div class="name">' + esc(a.name) + '</div><div class="small muted">' + f2(a.price) + ' ' + esc(a.cur) + ' · <span class="' + cls(a.chg) + '">' + sp(a.chg) + '</span>' + (a.sector ? ' · ' + esc(a.sector) : '') + '</div></div>' +
      '<div style="display:none" class="hide-sm"></div>' + spark(a.hist, 70, 26, col) +
      '<div style="text-align:right;min-width:92px;flex:none"><span class="pill ' + pillCls(a.plan.action) + '">' + esc(actLabel(a.plan.action, a.plan.label)) + '</span><div class="small dimmer" style="margin-top:4px">' + esc(HL[a.plan.h]) + '</div></div></a>';
  }
  function newsList(list) {
    if (!list || !list.length) return '<div class="empty">Pas d\'actualité récente.</div>';
    return '<div class="news">' + list.map(function (n) {
      var c = n.tone === "positif" ? "up" : n.tone === "négatif" ? "down" : "flat";
      return '<a href="' + esc(n.link) + '" target="_blank" rel="noopener"><span class="tone ' + c + '">' + (n.tone === "positif" ? "▲" : n.tone === "négatif" ? "▼" : "•") + '</span>' + esc(n.title) + ' <span class="dimmer small">— ' + esc(n.source || "") + (n.time ? ", " + ago(n.time) : "") + '</span></a>';
    }).join("") + '</div>';
  }
  function planCard(a, compact) {
    var p = a.plan, act = p.action;
    var active = act === "ENTRER" || act === "ATTENDRE_REPLI" || act === "ATTENDRE_CONFIRMATION";
    var sentence = act === "ENTRER" ? "Acheter autour de <b>" + f2(a.price) + "</b>, viser <b>" + f2(p.target) + "</b>, sortir si le cours passe sous <b>" + f2(p.stop) + "</b>."

  function diagram(key) {

    var v = q.value.trim().toLowerCase();
    if (!v || !D) { res.style.display = "none"; return; }
    var hits = Object.keys(D.stocks).map(function (k) { return D.stocks[k]; }).filter(function (a) { return a.name.toLowerCase().indexOf(v) >= 0 || a.sym.toLowerCase().indexOf(v) >= 0; }).slice(0, 10);
    res.innerHTML = hits.length ? hits.map(function (a) { return '<a href="#/v/' + encodeURIComponent(a.sym) + '"><span>' + esc(a.name) + '</span><span class="mono dimmer">' + esc(a.sym) + '</span></a>'; }).join("") : '<a><span class="muted">Aucune valeur suivie ne correspond</span></a>';
    res.style.display = "block";
  });
  res.addEventListener("click", function () { res.style.display = "none"; q.value = ""; });
  document.addEventListener("click", function (e) { if (!e.target.closest(".search")) res.style.display = "none"; });

  fetch("data.json?t=" + Math.floor(Date.now() / 300000)).then(function (r) { return r.json(); }).then(function (d) {
    D = d; render();
    var hr = location.hash.replace(/^#\/?/, "");
    if (!accepted() && !/^(conditions|confidentialite)/.test(hr)) showTerms(); else setTimeout(maybeNewsletter, 6000);
  })
    .catch(function () { document.getElementById("app").innerHTML = '<div class="loading">Données indisponibles pour le moment. Réessaie dans quelques minutes.</div>'; });
})();
</script>
</body>
</html>
